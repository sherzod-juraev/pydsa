name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies (with Dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff - lint
        run: ruff check .
      - name: Ruff - format check
        run: ruff format . --check
      - name: Mypy - type check
        run: mypy pydsa
      - name: Interrogate - docstring check
        run: interrogate pydsa -v
      - name: Pytest - verify docstring examples
        run: pytest --doctest-modules pydsa -v
      - name: Pytest - run test suite
        run: pytest tests -v
