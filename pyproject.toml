[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydsa"
dynamic = ["version"]
description = "Pure Python Data Structures & Algorithms — built from scratch"
requires-python = ">=3.12"
authors = [
    {name = "Sherzod Juraev", email = "juraevsherzod9943@gmail.com"}
]
readme = "README.md"
license = "MIT"
keywords = ["data-structures", "algorithms", "education", "python", "dsa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
nox = ["nox>=2026.2.9",]
dev = [
    "pytest>=9.0",
    "pytest-sugar>=1.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "interrogate>=1.7.0",
]
docs = [
    "autodocsumm>=0.2.14",
    "doc8>=1.0.0",
    "pydata-sphinx-theme>=0.15.0",
    "rstcheck>=6.0.0",
    "sphinx>=7.0.0",
    "sphinx-design>=0.5.0",
    "sphinx-lint>=1.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-notfound-page>=1.1.0",
    "sphinxext-opengraph>=0.13.0",
    "sphinx-sitemap>=2.6.0"
]
live = [
    "pydsa[docs]",
    "sphinx-autobuild>=2025.8.25",
]
all = [
    "pydsa[dev]",
    "pydsa[live]",
    "pydsa[nox]",
]

[project.urls]
Homepage = "https://github.com/sherzod-juraev/pydsa"
Documentation = "https://pydsa-educational.readthedocs.io"
Repository = "https://github.com/sherzod-juraev/pydsa"

[tool.setuptools.dynamic]
version = {attr = "pydsa.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["pydsa", "pydsa.*"]
exclude = ["tests", "tests.*", "docs", "docs.*"]

[tool.setuptools.package-data]
pydsa = ["**/*.pyi", "py.typed"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --strict-config -p no:warnings"
filterwarnings = [
    "ignore::UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
include = [
    "pydsa/**/*.py",
    "tests/**/*.py",
    "noxfile.py",
]
exclude = [
    "pydsa/__pycache__", "pydsa/**/__pycache__",
    "tests/__pycache__", "tests/**/__pycache__",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "D",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",
    "N802",
    "SIM",
]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.interrogate]
fail-under = 100
verbose = 1
quiet = false
whitelist-regex = []
color = true
exclude = ["docs", "tests"]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false

[tool.rstcheck]
ignore_directives = [
    "button-link",
    "button-ref",
    "card",
    "toctree",
    "automodule",
    "autoclass",
    "autofunction",
    "tab-item",
    "tab-set",
    "grid",
    "grid-item-card",
]
ignore_roles = ["meth", "func", "class", "doc", "ref",]
report_level = "warning"
ignore_paths = [
    "docs/build/*",
]

[tool.doc8]
max-line-length = 100
ignore-path = [
    "docs/build",
    "docs/source/_static",
]

[tool.sphinx-lint]
max-line-length = 100
exclude = [
    "docs/build/*",
]
